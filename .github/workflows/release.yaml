name: Release

# Builds the production Android APK and, for a tag, publishes it to a GitHub
# Release.
#
# Cut a release by pushing a tag (e.g. `git tag v1.3 && git push origin v1.3`).
# A manual run builds a downloadable artifact and does not publish.
#
# Repository secrets for a signed release:
#   KEYSTORE_BASE64    base64 of the release keystore  (base64 -i release.jks)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
# Without them the workflow still builds, but produces a debug-signed APK.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for this build (e.g. 1.3)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: false
          persist-credentials: false

      - name: Checkout audio submodule
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git submodule sync --recursive -- libs/VirtuaAPU
          git submodule update --init --recursive --depth 1 -- libs/VirtuaAPU
          test -d libs/VirtuaAPU/src
          test -d port/ppu/src

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: v3.0.8
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: android-apk
          package-cache: true
          package-cache-key: android-apk
          project-path: '.'

      - name: Build libmain.so (arm64-v8a + x86_64)
        shell: bash
        run: |
          # Multi-region fat build, 384px widescreen baseline — the on-device
          # default. Each ABI drops its lib into build/android/<abi>/ where
          # Gradle's jniLibs looks.
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          for abi in arm64-v8a x86_64; do
            xmake f -y -p android -a "$abi" --ndk="$NDK" \
              --game_version=USA --widescreen_width=384
            xmake build -y tmc_pc
            test -f "build/android/$abi/libmain.so"
          done

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secrets set - building a debug-signed APK."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          # Only the non-secret path is exported; passwords stay in this step's
          # environment and are never written to GITHUB_ENV.
          {
            echo "TMC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
          } >> "$GITHUB_ENV"

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            name="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            name="${{ inputs.version }}"
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          # versionCode: major*1000000 + minor*10000 + patch*100 + revision
          IFS=. read -r a b c d <<< "$name"
          code=$(( ${a:-0} * 1000000 + ${b:-0} * 10000 + ${c:-0} * 100 + ${d:-0} ))
          [ "$code" -ge 1 ] || code=1
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        env:
          TMC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TMC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TMC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          ./gradlew assembleRelease --no-daemon \
            -PtmcVersionName="${{ steps.version.outputs.name }}" \
            -PtmcVersionCode="${{ steps.version.outputs.code }}"

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | grep -q "package: name='dev.picori.tmc'"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmain.so'
          unzip -l "$APK" | grep -q 'lib/x86_64/libmain.so'
          if unzip -l "$APK" | grep -Eq '\.gba$|\.jks$|\.keystore$'; then
            echo "::error::APK must not contain a ROM or signing key."
            exit 1
          fi
          echo "OK: signed dev.picori.tmc APK carrying both ABIs."

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/tmc-android-${{ steps.version.outputs.name }}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tmc-android-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          token: ${{ github.token }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
